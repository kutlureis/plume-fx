
name: Build Plume APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "HATA: Proje ZIP dosyasi bulunamadi."
            exit 1
          fi
          unzip -o "$ZIP" -d extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          PROJECT=$(find extracted -name gradlew -type f | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "HATA: Gradle Wrapper bulunamadi."
            exit 1
          fi
          cd "$(dirname "$PROJECT")"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: plume-launcher-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
